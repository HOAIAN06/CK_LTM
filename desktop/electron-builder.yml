appId: com.nihongoquest.desktop
productName: NihongoQuest
copyright: NihongoQuest
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: NihongoQuest-${version}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NihongoQuest
